name: Buscar fincas

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 h (UTC), fuera de la hora en punto
  workflow_dispatch:
    inputs:
      seed:
        description: "Primera carga: marcar todo como visto sin enviar correo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Generar datos geográficos si faltan
        run: |
          if [ ! -f data/coastline_gipuzkoa.geojson ] || [ ! -f data/municipios.csv ]; then
            python scripts/build_geodata.py
          fi

      - name: Buscar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: fincas run ${{ inputs.seed && '--seed' || '' }}

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "fincas-bot"
          git config user.email "fincas-bot@users.noreply.github.com"
          git add state/ data/
          git diff --cached --quiet || git commit -m "Actualiza estado [skip ci]"
          git push
