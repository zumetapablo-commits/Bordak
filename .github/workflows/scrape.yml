name: Buscar fincas

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 h (UTC), fuera de la hora en punto
  workflow_dispatch:
    inputs:
      seed:
        description: "Primera carga: marcar todo como visto sin enviar correo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Comprobar datos geográficos
        run: |
          if [ ! -f data/coastline_gipuzkoa.geojson ] || [ ! -f data/municipios.csv ]; then
            echo "::error::Faltan los datos geográficos: lanza el workflow 'Generar datos geográficos'"
            exit 1
          fi

      - name: Comprobar configuración del correo
        id: cfg
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          if [ -z "$SMTP_HOST" ]; then
            echo "::warning::Faltan los secrets del correo (SMTP_HOST…): no se busca hasta configurarlos"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar
        id: buscar
        if: steps.cfg.outputs.ok == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: fincas run ${{ inputs.seed && '--seed' || '' }}

      - name: Guardar estado
        if: success() || failure() && steps.buscar.outcome == 'failure'
        run: |
          git config user.name "fincas-bot"
          git config user.email "fincas-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Actualiza estado [skip ci]"
          git push
